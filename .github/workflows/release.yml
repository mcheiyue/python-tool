name: Release

# 仅由 tag 触发（v1.0.0 之类）。失败后用 Actions 页面的 "Re-run all jobs" 重跑。
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            build/requirements-bootstrap.txt

      # 复用 Nuitka/scons 的编译中间产物：中途失败重跑时只需续编剩余文件
      - uses: actions/cache@v4
        with:
          path: |
            dist/standalone/main.build
            dist/onefile/main.build
          # 按解释器、依赖锁和构建参数隔离缓存；业务代码改动仍复用依赖的编译结果。
          key: nuitka-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'build/requirements-bootstrap.txt', 'build/build_nuitka.bat') }}

      - name: 安装依赖（含 Nuitka）
        run: |
          python -m pip install -r build/requirements-bootstrap.txt
          python -m pip install --no-build-isolation --no-deps -r requirements.lock
          python -m pip check

      - name: 安装 Inno Setup
        run: choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y

      # choco 的 Inno Setup 不带中文语言文件，installer.iss 引用它后 ISCC 会失败
      - name: 补装 Inno 中文语言文件
        shell: pwsh
        run: |
          $dir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $lang = Join-Path $dir "ChineseSimplified.isl"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl" -OutFile $lang
          Get-Item $lang | Select-Object FullName, Length

      - name: 校验 tag 与 VERSION 一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          filever=$(tr -d '\r\n' < VERSION)
          echo "tag=$tag  VERSION=$filever"
          if [ -z "$filever" ] || [ "$tag" != "$filever" ]; then
            echo "::error::git tag ($tag) 与 VERSION 文件 ($filever) 不一致"
            exit 1
          fi

      # 两个脚本末尾都有 pause，CI 下用 < NUL 让 stdin 立即 EOF
      - name: 构建（Nuitka：目录版 + 单文件版）
        shell: cmd
        run: cmd /c "build\build_nuitka.bat < NUL"

      - name: 打包（安装包 + 绿化 zip + 单文件）
        shell: cmd
        run: cmd /c "build\build_release.bat < NUL"

      # 只校验文件存在不够：v0.0.4/v0.0.5 产物齐全却启动即崩（缺包数据），
      # 必须实跑一次确认能起来，否则照样会把坏包发出去
      - name: 冒烟：打包产物必须能启动（可写 + 只读程序目录）
        shell: pwsh
        run: |
          $src = "dist\standalone\main.dist"
          $env:QT_QPA_PLATFORM = "offscreen"
          # 只读程序目录：模拟装到 Program Files（可写状态必须回退到 %LOCALAPPDATA%）
          $ro = Join-Path $env:RUNNER_TEMP "ro_app"
          Copy-Item $src $ro -Recurse -Force
          icacls $ro /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)(RX)" | Out-Null
          foreach ($dir in @((Resolve-Path $src).Path, $ro)) {
            $out = (& (Join-Path $dir "OfficeToolkit.exe") --benchmark 2>&1 | Out-String)
            $code = $LASTEXITCODE
            if ($code -ne 0) { Write-Host $out; Write-Error "$dir 启动失败 exit=$code"; exit 1 }
            if ($out -notmatch "BENCHMARK_STARTUP_TIME_MS") { Write-Host $out; Write-Error "$dir 未真正启动"; exit 1 }
            Write-Host "$dir -> $(($out -split "`n" | Select-String 'BENCHMARK_STARTUP_TIME_MS') -join '')"
          }
          $cli = (Resolve-Path "dist\cli\OfficeToolkit_CLI.exe").Path
          $help = (& $cli --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "merge") {
            Write-Host $help
            Write-Error "CLI 启动冒烟失败"
            exit 1
          }
          Write-Host "CLI -> help ok"

      - name: 校验三个产物齐全
        shell: pwsh
        run: |
          $missing = @()
          foreach ($pat in @("OfficeToolkit_Setup_v*.exe","OfficeToolkit_Portable_v*.zip","OfficeToolkit_Single_v*.exe","OfficeToolkit_CLI_v*.exe")) {
            $f = Get-ChildItem "release\$pat" -ErrorAction SilentlyContinue
            if ($f) { $f | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name } } else { $missing += $pat }
          }
          if ($missing.Count -gt 0) { Write-Error "缺少产物: $($missing -join ', ')"; exit 1 }

      - name: 发布到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.zip --clobber
