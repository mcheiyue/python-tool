name: Release

# 仅由 tag 触发（v1.0.0 之类）。失败后用 Actions 页面的 "Re-run all jobs" 重跑。
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 复用 Nuitka/scons 的编译中间产物：中途失败重跑时只需续编剩余文件
      - uses: actions/cache@v4
        with:
          path: |
            dist/standalone/main.build
            dist/onefile/main.build
          key: nuitka-${{ hashFiles('requirements.txt', 'main.py', 'core/**', 'ui/**', 'app/**', 'config/**') }}

      - name: 安装依赖（含 Nuitka）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # choco 的 Inno Setup 不带中文语言文件，installer.iss 引用它后 ISCC 会失败
      - name: 补装 Inno 中文语言文件
        shell: pwsh
        run: |
          $dir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $lang = Join-Path $dir "ChineseSimplified.isl"
          if (-not (Test-Path $lang)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile $lang
          }
          Get-Item $lang | Select-Object FullName, Length

      - name: 校验 tag 与 VERSION 一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          filever=$(tr -d '\r\n' < VERSION)
          echo "tag=$tag  VERSION=$filever"
          if [ -z "$filever" ] || [ "$tag" != "$filever" ]; then
            echo "::error::git tag ($tag) 与 VERSION 文件 ($filever) 不一致"
            exit 1
          fi

      # 两个脚本末尾都有 pause，CI 下用 < NUL 让 stdin 立即 EOF
      - name: 构建（Nuitka：目录版 + 单文件版）
        shell: cmd
        run: cmd /c "build\build_nuitka.bat < NUL"

      - name: 打包（安装包 + 绿化 zip + 单文件）
        shell: cmd
        run: cmd /c "build\build_release.bat < NUL"

      - name: 校验三个产物齐全
        shell: pwsh
        run: |
          $missing = @()
          foreach ($pat in @("OfficeToolkit_Setup_v*.exe","OfficeToolkit_Portable_v*.zip","OfficeToolkit_Single_v*.exe")) {
            $f = Get-ChildItem "release\$pat" -ErrorAction SilentlyContinue
            if ($f) { $f | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name } } else { $missing += $pat }
          }
          if ($missing.Count -gt 0) { Write-Error "缺少产物: $($missing -join ', ')"; exit 1 }

      - name: 发布到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.zip --clobber
