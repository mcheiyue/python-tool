name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # 无显示环境：Qt 用 offscreen 平台插件（控件构造/grab 均可用）
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            build/requirements-bootstrap.txt

      - name: 安装依赖
        run: |
          python -m pip install -r build/requirements-bootstrap.txt
          python -m pip install --no-build-isolation --no-deps -r requirements.lock
          python -m pip check

      - name: 运行测试
        run: python -m pytest
